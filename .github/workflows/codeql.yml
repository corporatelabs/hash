name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Private repository without code scanning
        if: github.event.repository.visibility != 'public'
        run: echo "CodeQL runs when this repository is public. Private repositories need GitHub Advanced Security."
      - uses: actions/checkout@v4
        if: github.event.repository.visibility == 'public'
      - uses: github/codeql-action/init@v3
        if: github.event.repository.visibility == 'public'
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        if: github.event.repository.visibility == 'public'
