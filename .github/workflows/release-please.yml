name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    # contents: write creates the tag and the GitHub Release.
    # pull-requests: write opens the release PR. The repository setting
    # "Allow GitHub Actions to create and approve pull requests" must be on,
    # or this token is rejected even with that permission.
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
