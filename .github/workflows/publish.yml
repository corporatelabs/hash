name: Publish images

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: vars.PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7

      - name: Decide registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are set. Also publishing docker.io/corporatelabs/hash."
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are unset. Publishing ghcr.io/${{ github.repository }} only."
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'release' && github.event.release.prerelease == false) }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: docker/login-action@v3
        if: steps.registries.outputs.dockerhub == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: hubmeta
        if: steps.registries.outputs.dockerhub == 'true'
        uses: docker/metadata-action@v6
        with:
          images: docker.io/corporatelabs/hash
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'release' && github.event.release.prerelease == false) }}

      - name: Copy the image to Docker Hub
        if: steps.registries.outputs.dockerhub == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.hubmeta.outputs.tags }}
          REPO: ${{ github.repository }}
        run: |
          src="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')@${DIGEST}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" "$src"
          done <<< "$TAGS"

      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-release-assets: false

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-sbom@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - uses: sigstore/cosign-installer@v3
      - name: Sign images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB: ${{ steps.registries.outputs.dockerhub }}
          REPO: ${{ github.repository }}
        run: |
          repo="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          cosign sign --yes "ghcr.io/${repo}@${DIGEST}"
          if [ "$DOCKERHUB" = "true" ]; then
            cosign sign --yes "docker.io/corporatelabs/hash@${DIGEST}"
          else
            echo "Skipping the Docker Hub signature."
          fi
