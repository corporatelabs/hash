name: Bug
description: Something in hash does not behave as documented
title: "bug: "
labels: []
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where
      options:
        - Cloudflare Worker
        - Docker / Node
        - Browser only
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra detail
      description: Do not paste secrets, passwords, or the part of a link after #.
