# Build this tree: docker compose up --build
# The published image is ghcr.io/corporatelabs/hash. This file does not pull it.
# Local default is development plus the placeholder pepper.
# Production must set ENVIRONMENT=production and a unique RATE_LIMIT_PEPPER.
services:
  hash:
    build: .
    image: hash:local
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:-development-only-pepper}
      STORAGE: sqlite
      DATABASE_PATH: /data/hash.sqlite
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://hash.corporatelabs.ai}
    volumes:
      - hash-data:/data
    read_only: true
    tmpfs:
      - /tmp
    user: "65532:65532"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  hash-redis:
    profiles: ["redis"]
    build: .
    image: hash:local
    ports:
      - "8080:8080"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      RATE_LIMIT_PEPPER: ${RATE_LIMIT_PEPPER:-development-only-pepper}
      STORAGE: redis
      REDIS_URL: redis://redis:6379
    read_only: true
    tmpfs:
      - /tmp
    user: "65532:65532"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    profiles: ["redis"]
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hash-data:
